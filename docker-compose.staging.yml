services:
  postgres:
    image: postgres:16
    container_name: competition-manager-staging-db
    ports:
      - '15432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${STAGING_POSTGRES_PASSWORD}
      - POSTGRES_DB=competitionmanager
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - staging-network

  backend:
    image: ${DOCKER_REGISTRY}/staging-backend:latest
    container_name: competition-manager-staging-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=staging
      - PORT=15000
      - DATABASE_URL=postgres://postgres:${STAGING_POSTGRES_PASSWORD}@postgres:5432/competitionmanager
      - BETTER_AUTH_SECRET=${STAGING_AUTH_SECRET}
      - BETTER_AUTH_URL=http://localhost:18080
      - LBFA_URL=${LBFA_URL}
      - LBFA_USERNAME=${LBFA_USERNAME}
      - LBFA_PASSWORD=${LBFA_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging-network

  frontend:
    image: ${DOCKER_REGISTRY}/staging-frontend:latest
    container_name: competition-manager-staging-frontend
    environment:
      - VITE_NODE_ENV=staging
      - VITE_API_URL=http://localhost:18080
      - VITE_SOCKET_URL=http://localhost:18080
    volumes:
      - staging_frontend_data:/app/frontend/dist
    networks:
      - staging-network

  nginx:
    image: nginx:alpine
    container_name: competition-manager-staging-nginx
    ports:
      - '18080:80' # Staging runs on port 18080
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
      - staging_frontend_data:/var/www/competitionmanager
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - staging-network

volumes:
  staging_frontend_data:

networks:
  staging-network:
    driver: bridge
