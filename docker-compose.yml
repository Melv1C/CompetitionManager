services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - my-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?schema=public
      BACKEND_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      BETTER_AUTH_SECRET: some-very-long-secret-key-as-it-should-be-at-least-32-characters
      DB_SEED_USERS_ENABLED: 'true'
      ATHLETE_SYNC_USE_MOCK: 'true'
      STRIPE_SECRET_KEY: sk_test_xxx
      STRIPE_WEBHOOK_SECRET: whsec_xxx
      EMAIL_USER: your.email@gmail.com
      EMAIL_PASS: your-email-password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - my-network
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_NODE_ENV: development
      VITE_API_URL: http://localhost:8080
    volumes:
      - frontend-dist:/app/frontend/dist
    networks:
      - my-network

  nginx:
    image: nginx:alpine
    volumes:
      - frontend-dist:/var/www/competitionmanager
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - backend
      - frontend
    networks:
      - my-network

volumes:
  db-data:
  frontend-dist:

networks:
  my-network:
    driver: bridge
