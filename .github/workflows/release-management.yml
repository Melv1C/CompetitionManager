name: Release Management

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.0)'
        required: true
        type: string
      release_type:
        description: 'Type of release'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for changelog generation

      - name: Validate version format
        run: |
          if [[ ! "${{ github.event.inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Use vX.Y.Z (e.g., v1.2.0)"
            exit 1
          fi

      - name: Check if tag already exists
        run: |
          if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "❌ Tag ${{ github.event.inputs.version }} already exists"
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "## 🎉 Initial Release" > changelog.md
            echo "" >> changelog.md
            echo "This is the first release of Competition Manager." >> changelog.md
          else
            echo "## 🚀 What's Changed" > changelog.md
            echo "" >> changelog.md
            
            # Generate commit messages since last tag
            git log ${LATEST_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges >> changelog.md
          fi

          # Read changelog content
          CHANGELOG_CONTENT=$(cat changelog.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${{ github.event.inputs.version }}" -m "Release ${{ github.event.inputs.version }}"
          git push origin "${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---

            ### 📦 Installation

            #### Docker Images
            ```bash
            # Backend
            docker pull ghcr.io/melv1c/competitionmanager/backend:${{ github.event.inputs.version }}

            # Frontend  
            docker pull ghcr.io/melv1c/competitionmanager/frontend:${{ github.event.inputs.version }}
            ```

            #### Docker Compose
            ```bash
            # Update your docker-compose.yml to use the new version
            # Then run:
            docker compose pull
            docker compose up -d
            ```

            ### 🚀 Deployment
            Creating this release will automatically trigger deployment to production.
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}

      - name: Trigger production deployment
        run: |
          echo "🚀 Tag ${{ github.event.inputs.version }} created successfully!"
          echo "Production deployment will be triggered automatically."
