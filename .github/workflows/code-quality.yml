name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm install

      - name: Validate i18n translations
        run: npm run i18n:validate-ci

      - name: Install dependencies (core)
        run: npm run install:core

      - name: Build core
        run: |
          cd core
          npm run build

      - name: Install dependencies (backend)
        run: npm run install:backend

      - name: Check Prisma schema
        run: |
          cd backend
          npx prisma validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build backend
        run: |
          cd backend
          npm run build

      - name: Install dependencies (frontend)
        run: npm run install:frontend

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build
