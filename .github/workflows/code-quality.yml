name: Code Quality

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            core/package-lock.json
            ui/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install root dependencies
        run: npm install

      - name: Install dependencies (core)
        run: npm run install:core

      - name: Install dependencies (ui)
        run: npm run install:ui -- --include=optional

      - name: Install dependencies (backend)
        run: npm run install:backend

      - name: Install dependencies (frontend)
        run: npm run install:frontend

      - name: Install dependencies (desktop)
        run: npm run install:desktop

      - name: Generate Prisma client (backend)
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydb

      - name: Generate Prisma client (desktop)
        run: |
          cd desktop
          npx prisma generate
        env:
          DB_LOCAL_URL: postgresql://user:password@localhost:5432/mydb

  format-check:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Check code formatting
        run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        package: [core, ui, backend, frontend, desktop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build core (prerequisite)
        if: matrix.package != 'core'
        run: |
          cd core
          npm run build

      - name: Build UI (prerequisite)
        if: matrix.package == 'frontend' || matrix.package == 'desktop'
        run: |
          cd ui
          npm run build

      - name: Lint ${{ matrix.package }}
        run: npm run lint:${{ matrix.package }}

  i18n-validation:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Validate i18n translations
        run: npm run i18n:ci

  database-check:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Check Prisma schema
        run: |
          cd backend
          npx prisma validate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydb

  build:
    runs-on: ubuntu-latest
    needs: [setup, lint, format-check]
    strategy:
      matrix:
        package: [core, ui, backend, frontend, desktop]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Build core (prerequisite)
        if: matrix.package != 'core'
        run: |
          cd core
          npm run build

      - name: Build UI (prerequisite)
        if: matrix.package == 'frontend' || matrix.package == 'desktop'
        run: |
          cd ui
          npm run build

      - name: Generate Prisma client (prerequisite for backend)
        if: matrix.package == 'backend'
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydb

      - name: Build ${{ matrix.package }}
        run: |
          cd ${{ matrix.package }}
          npm run build
