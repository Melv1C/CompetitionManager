name: Code Quality

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  # ============================================
  # 1. Fail-fast checks (parallel, minimal deps)
  # ============================================
  database-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydb

  i18n-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Validate i18n translations
        run: npm run i18n:ci

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Check code formatting
        run: npm run format:check

  # ============================================
  # 2. Detect changes
  # ============================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ui: ${{ steps.filter.outputs.ui }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
            ui:
              - 'core/**'
              - 'ui/**'
            backend:
              - 'core/**'
              - 'backend/**'
            frontend:
              - 'core/**'
              - 'ui/**'
              - 'frontend/**'
            desktop:
              - 'core/**'
              - 'ui/**'
              - 'desktop/**'

  # ============================================
  # 3. Setup (only if changes detected)
  # ============================================
  setup:
    runs-on: ubuntu-latest
    needs: [database-check, i18n-validation, format-check, changes]
    if: |
      needs.changes.outputs.core == 'true' ||
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install core
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.desktop == 'true'
        run: npm ci
        working-directory: core

      - name: Install ui
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.desktop == 'true'
        run: npm ci
        working-directory: ui

      - name: Install backend
        if: needs.changes.outputs.backend == 'true'
        run: npm ci
        working-directory: backend

      - name: Install frontend
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci
        working-directory: frontend

      - name: Install desktop
        if: needs.changes.outputs.desktop == 'true'
        run: npm ci
        working-directory: desktop

      - name: Generate Prisma client (backend)
        if: needs.changes.outputs.backend == 'true'
        run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydb

      - name: Generate Prisma client (desktop)
        if: needs.changes.outputs.desktop == 'true'
        run: npx prisma generate
        working-directory: desktop
        env:
          DB_LOCAL_URL: postgresql://user:password@localhost:5432/mydb

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}

  # ============================================
  # 4. Lint (only changed packages)
  # ============================================
  lint-core:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run lint:core

  lint-ui:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core
      - run: npm run lint:ui

  lint-backend:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core
      - run: npm run lint:backend

  lint-frontend:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core
      - run: npm run build
        working-directory: ui
      - run: npm run lint:frontend

  lint-desktop:
    runs-on: ubuntu-latest
    needs: [changes, setup]
    if: needs.changes.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core
      - run: npm run build
        working-directory: ui
      - run: npm run lint:desktop

  # ============================================
  # 5. Build (only changed packages)
  # ============================================
  build-core:
    runs-on: ubuntu-latest
    needs: [changes, setup, lint-core]
    if: needs.changes.outputs.core == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core

  build-ui:
    runs-on: ubuntu-latest
    needs: [changes, setup, lint-ui]
    if: needs.changes.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core
      - run: npm run build
        working-directory: ui

  build-backend:
    runs-on: ubuntu-latest
    needs: [changes, setup, lint-backend]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core
      - run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/mydb
      - run: npm run build
        working-directory: backend

  build-frontend:
    runs-on: ubuntu-latest
    needs: [changes, setup, lint-frontend]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core
      - run: npm run build
        working-directory: ui
      - run: npm run build
        working-directory: frontend

  build-desktop:
    runs-on: ubuntu-latest
    needs: [changes, setup, lint-desktop]
    if: needs.changes.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            core/node_modules
            ui/node_modules
            backend/node_modules
            frontend/node_modules
            desktop/node_modules
          key: ${{ runner.os }}-modules-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: npm run build
        working-directory: core
      - run: npm run build
        working-directory: ui
      - run: npm run build
        working-directory: desktop
