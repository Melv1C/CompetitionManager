name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual deployment

env:
  IMAGE_NAME_BACKEND: staging-backend
  IMAGE_NAME_FRONTEND: staging-frontend

jobs:
  # Only deploy if all quality checks pass
  quality-gate:
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  build-and-deploy:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      # Deploy to VPS staging server
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Deploying to staging environment..."

            # Create staging deployment directory
            STAGING_DIR="./competitionmanager-staging"
            mkdir -p $STAGING_DIR
            cd $STAGING_DIR

            # Download docker-compose and nginx config from repository
            echo "📥 Downloading configuration files..."
            curl -sL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.staging.yml -o docker-compose.yml
            curl -sL https://raw.githubusercontent.com/${{ github.repository }}/main/nginx.staging.conf -o nginx.staging.conf

            # Create necessary directories
            mkdir -p postgres-data backups certbot/www certbot/conf

            # Create environment file with secrets
            cat > .env << EOF
            DOCKER_REGISTRY=${{ secrets.DOCKER_USERNAME }}
            STAGING_POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
            STAGING_AUTH_SECRET=${{ secrets.STAGING_AUTH_SECRET }}
            LBFA_URL=${{ secrets.LBFA_URL }}
            LBFA_USERNAME=${{ secrets.LBFA_USERNAME }}
            LBFA_PASSWORD=${{ secrets.LBFA_PASSWORD }}
            EOF

            # Login to container registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            echo "📦 Pulling Docker images..."
            docker-compose pull

            # Stop existing containers if running
            echo "⏹️ Stopping existing staging containers..."
            docker-compose down --remove-orphans || true

            # Start new containers
            echo "🚀 Starting staging containers..."
            docker-compose up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to be ready..."
            sleep 30

            # Check if services are running
            if docker-compose ps | grep -q "Up"; then
              echo "✅ Staging deployment completed successfully!"
            else
              echo "❌ Some services failed to start"
              docker-compose logs
              exit 1
            fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Staging deployment successful!"
          else
            echo "❌ Staging deployment failed!"
          fi
