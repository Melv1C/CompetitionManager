name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*' # Matches v1.0.0, v2.1.3, etc.
  workflow_dispatch: # Allow manual deployment
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # Run quality checks on the tagged version
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm run install:core
          npm run install:backend
          npm run install:frontend

      - name: Run linting
        run: |
          npm run lint:core
          npm run lint:backend
          npm run lint:frontend

      - name: Run type checking
        run: |
          npm run typecheck:core
          npm run typecheck:backend
          npm run typecheck:frontend

      - name: Build applications
        run: |
          npm run build:core
          npm run build:backend
          npm run build:frontend

  build-and-deploy:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event.inputs.tag }}" != "" ]; then
            VERSION=${{ github.event.inputs.tag }}
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=production
            type=raw,value=latest

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=production
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      # Deploy to VPS production server
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Deploying version ${{ steps.version.outputs.version }} to production..."

            # Create production deployment directory
            PROD_DIR="./competitionmanager-production"
            mkdir -p $PROD_DIR
            cd $PROD_DIR

            # Download docker-compose and nginx config from repository
            echo "📥 Downloading configuration files..."
            curl -sL https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.version.outputs.version }}/docker-compose.production.yml -o docker-compose.yml
            curl -sL https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.version.outputs.version }}/nginx.production.conf -o nginx.production.conf

            # Create necessary directories
            mkdir -p postgres-data backups certbot/www certbot/conf

            # Create environment file with secrets
            cat > .env << EOF
            DOCKER_REGISTRY=${{ secrets.DOCKER_USERNAME }}
            PROD_POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            PROD_AUTH_SECRET=${{ secrets.PROD_AUTH_SECRET }}
            LBFA_URL=${{ secrets.LBFA_URL }}
            LBFA_USERNAME=${{ secrets.LBFA_USERNAME }}
            LBFA_PASSWORD=${{ secrets.LBFA_PASSWORD }}
            EOF

            # Login to container registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            echo "📦 Pulling Docker images..."
            docker compose pull

            # Stop existing containers if running
            echo "⏹️ Stopping existing production containers..."
            docker compose down --remove-orphans || true

            # Start new containers
            echo "🚀 Starting production containers..."
            docker compose up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to be ready..."
            sleep 30

            # Check if services are running
            if docker compose ps | grep -q "Up"; then
              echo "✅ Production deployment completed successfully!"
            else
              echo "❌ Some services failed to start"
              docker compose logs
              exit 1
            fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Release ${{ steps.version.outputs.version }}

            This release has been automatically deployed to production.

            ### Docker Images
            - Backend: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ steps.version.outputs.version }}`
            - Frontend: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.version.outputs.version }}`

            ### Deployment
            - **Environment**: Production
            - **Deployed at**: ${{ github.event.head_commit.timestamp }}
            - **Commit SHA**: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment successful for version ${{ steps.version.outputs.version }}!"
          else
            echo "❌ Production deployment failed for version ${{ steps.version.outputs.version }}!"
          fi
