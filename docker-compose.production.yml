services:
  postgres:
    image: postgres:16
    container_name: competition-manager-prod-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PROD_POSTGRES_PASSWORD}
      - POSTGRES_DB=competitionmanager
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - production-network

  backend:
    image: ${DOCKER_REGISTRY}/production-backend:latest
    container_name: competition-manager-prod-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://postgres:${PROD_POSTGRES_PASSWORD}@postgres:5432/competitionmanager
      - BACKEND_URL=https://competitionmanager.be
      - FRONTEND_URL=https://competitionmanager.be
      - BETTER_AUTH_SECRET=${PROD_AUTH_SECRET}
      - LBFA_URL=${LBFA_URL}
      - LBFA_USERNAME=${LBFA_USERNAME}
      - LBFA_PASSWORD=${LBFA_PASSWORD}
      - STRIPE_SECRET_KEY=${PROD_STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${PROD_STRIPE_WEBHOOK_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - production-network

  frontend:
    image: ${DOCKER_REGISTRY}/production-frontend:latest
    container_name: competition-manager-prod-frontend
    environment:
      - VITE_NODE_ENV=production
      - VITE_API_URL=https://competitionmanager.be
    volumes:
      - production_frontend_data:/app/frontend/dist
    networks:
      - production-network

  nginx:
    image: nginx:alpine
    container_name: competition-manager-prod-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - production_frontend_data:/var/www/competitionmanager
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - production-network

  certbot:
    image: certbot/certbot:latest
    container_name: competition-manager-prod-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - production-network

volumes:
  production_frontend_data:

networks:
  production-network:
    driver: bridge
